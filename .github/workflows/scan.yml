name: scan
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run scanner
        run: python scanner.py
        env:
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
          PUSHOVER_USER: ${{ secrets.PUSHOVER_USER }}
      - name: Save alert history
        run: |
          git config user.name "scanner"
          git config user.email "scanner@users.noreply.github.com"
          git add state.json || true
          git diff --staged --quiet || (git commit -m "update alert history" && git push)
